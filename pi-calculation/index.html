<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Výpočet čísla π</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Font Awesome for icons -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
      rel="stylesheet"
    />
    <script src="scripts/calculatePi.js" defer></script>
    <style>
      /* Zajištění, že zápatí bude vždy dole */
      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      .container {
        flex: 1;
      }
      .footer {
        background-color: #f8f9fa;
        padding: 1rem 0;
      }
    </style>
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <h1 class="text-center mb-4">Výpočet čísla π</h1>
      <div class="row justify-content-center mb-4">
        <div class="col-md-6">
          <label for="decimalPlaces" class="form-label"
            >Počet desetinných míst (max 15):</label
          >
          <input
            type="number"
            id="decimalPlaces"
            class="form-control"
            min="1"
            max="15"
            value="10"
          />
        </div>
      </div>
      <div class="row justify-content-center mb-4">
        <div class="col-md-8 text-center">
          <div class="d-flex flex-wrap justify-content-center gap-2">
            <button
              class="btn btn-primary"
              onclick="calculatePiMethod('archimedes')"
            >
              Archimedes
            </button>
            <button
              class="btn btn-primary"
              onclick="calculatePiMethod('madhava')"
            >
              Madhava
            </button>
            <button
              class="btn btn-primary"
              onclick="calculatePiMethod('gregoryLeibniz')"
            >
              Gregory-Leibniz
            </button>
            <button
              class="btn btn-primary"
              onclick="calculatePiMethod('machin')"
            >
              Machin
            </button>
            <button
              class="btn btn-primary"
              onclick="calculatePiMethod('monteCarlo')"
            >
              Monte Carlo
            </button>
            <button
              class="btn btn-primary"
              onclick="calculatePiMethod('borwein')"
            >
              Borwein
            </button>
            <button
              class="btn btn-primary"
              onclick="calculatePiMethod('gaussLegendre')"
            >
              Gauss-Legendre
            </button>
            <button
              class="btn btn-primary"
              onclick="calculatePiMethod('chudnovsky')"
            >
              Chudnovsky
            </button>
            <button
              class="btn btn-primary"
              onclick="calculatePiMethod('alKashi')"
            >
              Al Káší
            </button>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col">
          <h2 class="text-center">Výsledky</h2>
          <div id="results" class="bg-white p-3 rounded shadow-sm border">
            <p class="text-muted text-center">
              Zde se zobrazí výsledky jednotlivých metod.
            </p>
          </div>
        </div>
      </div>
    </div>
    <!-- Zápatí -->
    <footer class="footer text-center mt-4">
      <div class="d-inline-flex justify-content-center align-items-center">
        <p class="mb-0 me-2">
          &copy; 2025 Dominik Šimon. Všechna práva vyhrazena.
        </p>
        <a
          href="https://github.com/SoumenX-CZ"
          target="_blank"
          class="text-dark"
        >
          <i class="fab fa-github fa-lg"></i>
        </a>
      </div>
    </footer>
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
